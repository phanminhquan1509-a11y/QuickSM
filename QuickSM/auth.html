<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSM - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Style/base.css">
    <link rel="stylesheet" href="../Style/main.css">
    <link rel="stylesheet" href="../Style/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="row g-0 w-100">
            <div class="col-md-6">
                <div class="auth-card login">
                    <h2 class="auth-title">Welcome back</h2>
                    <p class="auth-subtitle">Sign in to your QuickSM account</p>
                                    <form id="signin-form">
                                        <div class="mb-3">
                                            <label class="form-label">Email</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-envelope"></i></span>
                                                <input type="email" class="form-control" placeholder="you@example.com">
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-lock"></i></span>
                                                <input type="password" class="form-control" placeholder="Enter your password">
                                            </div>
                                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.875rem;">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="text-decoration-none" style="color: var(--color-primary); font-size: 0.875rem;">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-auth">Sign In</button>
                    </form>
                    <div class="divider">or</div>
                                    <button type="button" class="btn btn-outline-secondary btn-auth"><i class="fa-brands fa-google me-2"></i>Continue with Google</button>
                    <div class="auth-footer">
                        Don't have an account? <a href="auth-register.html">Register</a>
                    </div>
                    <div class="text-center mt-3">
                        <small class="text-muted">Demo: demo@quicksm.com / demo123</small>
                    </div>
                    <div class="text-center">
                        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/userData.js"></script>
</body>
</html>
