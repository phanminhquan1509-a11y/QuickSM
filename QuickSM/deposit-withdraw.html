<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSM - Deposit / Withdraw</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Style/base.css">
    <link rel="stylesheet" href="../Style/main.css">
    <link rel="stylesheet" href="../Style/auth.css">
    <link rel="stylesheet" href="../Style/deposit.css">
</head>
<body>
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'auth.html';
        }
    </script>
    <div class="auth-container">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">
                <i class="fa-solid fa-chart-line me-2"></i>QuickSM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="main.html"><i class="fa-solid fa-cart-shopping me-1"></i> Buy Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="deposit-withdraw.html"><i class="fa-solid fa-money-bill-transfer me-1"></i> Deposit/Withdraw</a></li>
                    <li class="nav-item"><a class="nav-link" href="support.html"><i class="fa-solid fa-life-ring me-1"></i> Support</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html"><i class="fa-solid fa-newspaper me-1"></i> News</a></li>
                </ul>
                <div class="d-flex gap-2" id="authSection"></div>
            </div>
        </div>
    </nav>

        <div class="row g-0 w-100">
            <div class="col-md-6 offset-md-3">
                <div class="auth-card deposit-card">
                    <h2 class="auth-title">Deposit / Withdraw</h2>
                    <p class="auth-subtitle">Manage your funds securely</p>

                    <div class="action-toggle">
                        <button class="toggle-btn active" id="depositBtn">Deposit</button>
                        <button class="toggle-btn" id="withdrawBtn">Withdraw</button>
                    </div>

                    <form id="deposit-form">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Credit Card Number</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-credit-card"></i></span>
                                <input type="text" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Expiry Date</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-calendar"></i></span>
                                    <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" required>
                                </div>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">CVV</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-shield-halved"></i></span>
                                    <input type="text" class="form-control" placeholder="123" maxlength="3" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-sack-dollar"></i></span>
                                <input type="number" class="form-control" placeholder="0.00" min="0" step="0.01" required>
                                <select class="form-select currency-select" style="max-width: 100px;">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                    <option value="JPY">JPY</option>
                                    <option value="VND">VND</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-auth" id="actionBtn">Deposit Funds</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/userData.js"></script>
    <script src="../script/deposit.js"></script>
</body>
</html>
