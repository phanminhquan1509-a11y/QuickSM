<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSM - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Style/base.css">
    <link rel="stylesheet" href="../Style/main.css">
    <link rel="stylesheet" href="../Style/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="row g-0 w-100">
            <div class="col-md-6 offset-md-6">
                <div class="auth-card register">
                    <h2 class="auth-title">Create account</h2>
                    <p class="auth-subtitle">Start your trading journey with QuickSM</p>
                    <form id="register-form">
                                        <div class="mb-3">
                                            <label class="form-label">Full Name</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-user"></i></span>
                                                <input type="text" class="form-control" placeholder="John Doe">
                                            </div>
                                            <div class="invalid-feedback">Full name must contain only letters and spaces</div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Email</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-envelope"></i></span>
                                                <input type="email" class="form-control" placeholder="you@example.com">
                                            </div>
                                            <div class="invalid-feedback">Please enter a valid email address</div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-lock"></i></span>
                                                <input type="password" class="form-control" placeholder="Create a password">
                                            </div>
                                            <div class="invalid-feedback">Password must be at least 6 characters and contain both letters and numbers</div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Confirm Password</label>
                                            <div class="input-group">
                                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-shield-halved"></i></span>
                                                <input type="password" class="form-control" placeholder="Confirm your password">
                                            </div>
                                            <div class="invalid-feedback">Passwords do not match</div>
                                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="agreeTerms">
                            <label class="form-check-label text-muted" for="agreeTerms" style="font-size: 0.875rem;">
                                I agree to the <a href="#" style="color: var(--color-primary);">Terms of Service</a> and <a href="#" style="color: var(--color-primary);">Privacy Policy</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-auth">Create Account</button>
                    </form>
                    <div class="divider">or</div>
                                    <button type="button" class="btn btn-outline-secondary btn-auth"><i class="fa-brands fa-google me-2"></i>Continue with Google</button>
                    <div class="auth-footer">
                        Already have an account? <a href="auth.html">Sign In</a>
                    </div>
                    <div class="text-center">
                        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/userData.js"></script>
</body>
</html>
