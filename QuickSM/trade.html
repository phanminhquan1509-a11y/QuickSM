<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSM - Buy Stocks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Style/base.css">
    <link rel="stylesheet" href="../Style/main.css">
    <link rel="stylesheet" href="../Style/auth.css">
    <link rel="stylesheet" href="../Style/trade.css">
</head>
<body>
    <script>
        if (!localStorage.getItem('quicksm_currentUser')) {
            window.location.href = 'auth.html';
        }
    </script>
    <div class="auth-container">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">
                <i class="fa-solid fa-chart-line me-2"></i>QuickSM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="trade.html"><i class="fa-solid fa-cart-shopping me-1"></i> Buy Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="deposit-withdraw.html"><i class="fa-solid fa-money-bill-transfer me-1"></i> Deposit/Withdraw</a></li>
                    <li class="nav-item"><a class="nav-link" href="support.html"><i class="fa-solid fa-life-ring me-1"></i> Support</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html"><i class="fa-solid fa-newspaper me-1"></i> News</a></li>
                </ul>
                <div class="d-flex gap-2" id="authSection"></div>
            </div>
        </div>
    </nav>

    <div class="container py-4 pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Your Watchlist</h3>
            <button class="btn btn-primary btn-sm" id="addStockBtn"><i class="fa-solid fa-plus me-1"></i> Add Stock</button>
        </div>

        <div id="addStockForm" class="mb-3" style="display: none;">
            <div class="input-group">
                <input type="text" class="form-control" id="stockSearchInput" placeholder="Search stock symbol (e.g. NVDA)">
                <button class="btn btn-outline-secondary" id="addStockConfirm">Add</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover" id="stockTable">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Change</th>
                        <th>Volume</th>
                        <th>Market Cap</th>
                        <th>P/E</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bottom Trading Dock -->
    <div class="trade-dock">
        <div class="container">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted small">Stock</label>
                    <select class="form-select form-select-sm" id="dockStock">
                        <option value="AAPL">AAPL - Apple Inc.</option>
                        <option value="AVGO">AVGO - Broadcom Inc.</option>
                        <option value="COST">COST - Costco Wholesale Corp.</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small">Quantity</label>
                    <input type="number" class="form-control form-control-sm" id="dockQty" min="1" value="1">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small">Price</label>
                    <input type="text" class="form-control form-control-sm" id="dockPrice" readonly>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small">Total</label>
                    <input type="text" class="form-control form-control-sm" id="dockTotal" readonly>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-primary w-100" id="submitOrder"><i class="fa-solid fa-check me-1"></i> Submit Order</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/stockServices.js"></script>
    <script src="../script/userData.js"></script>
    <script src="../script/trade.js"></script>
</body>
</html>
