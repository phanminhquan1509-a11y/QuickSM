<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSM - Support</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Style/base.css">
    <link rel="stylesheet" href="../Style/main.css">
    <link rel="stylesheet" href="../Style/auth.css">
    <link rel="stylesheet" href="../Style/support.css">
</head>
<body>
    <div class="auth-container">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">
                <i class="fa-solid fa-chart-line me-2"></i>QuickSM
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="trade.html"><i class="fa-solid fa-cart-shopping me-1"></i> Buy Stocks</a></li>
                    <li class="nav-item"><a class="nav-link" href="deposit-withdraw.html"><i class="fa-solid fa-money-bill-transfer me-1"></i> Deposit/Withdraw</a></li>
                    <li class="nav-item"><a class="nav-link" href="support.html"><i class="fa-solid fa-life-ring me-1"></i> Support</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html"><i class="fa-solid fa-newspaper me-1"></i> News</a></li>
                </ul>
                <div class="d-flex gap-2" id="authSection"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="support-card">
                    <div class="text-center mb-4">
                        <div class="support-icon">
                            <i class="fa-solid fa-life-ring"></i>
                        </div>
                        <h3 class="support-title">Support</h3>
                        <p class="support-subtitle">Tell us what problem you're having and we'll get back to you</p>
                    </div>

                    <form id="support-form">
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-tag"></i></span>
                                <input type="text" class="form-control" id="supportSubject" placeholder="Brief summary of your issue" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-list"></i></span>
                                <select class="form-select" id="supportCategory" required>
                                    <option value="" selected disabled>Select a category</option>
                                    <option value="account">Account Issues</option>
                                    <option value="deposit">Deposit/Withdrawal</option>
                                    <option value="trading">Trading Problems</option>
                                    <option value="technical">Technical Issues</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Describe your problem</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: var(--color-bg); border-color: var(--color-border); color: var(--color-text-secondary);"><i class="fa-solid fa-comment-dots"></i></span>
                                <textarea class="form-control" id="supportMessage" rows="5" placeholder="Please describe your issue in detail..." required></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3"><i class="fa-solid fa-paper-plane me-2"></i>Submit Ticket</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/userData.js"></script>
    <script src="../script/support.js"></script>
</body>
</html>
